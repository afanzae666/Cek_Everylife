name: Head Base Pixel Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Run pixel audit
        run: python tools/head_base_pixel_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: head-base-pixel-audit
          path: audit/head_base_pixel_audit.txt
